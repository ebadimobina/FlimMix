name: flimmix
description: "A modern Flutter app for discovering, searching, and bookmarking movies."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  get_storage: ^2.1.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: false
  web: false
  windows: false
  macos: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
